services:
  # Backend Web Service on Render
  - type: web
    name: aarogya-seva-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_NAME
        value: aarogya_session
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://aarogya-seva.vercel.app"
      - key: DATABASE_URL
        sync: false
